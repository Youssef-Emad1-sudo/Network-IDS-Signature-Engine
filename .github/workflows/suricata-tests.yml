name: Network IDS Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  suricata-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Suricata
        run: |
          sudo apt-get update
          sudo apt-get install -y suricata

      - name: Configure Suricata rules
        run: |
          sudo sed -i '/^rule-files:/a\  - '"$GITHUB_WORKSPACE"'/rules/local.rules' /etc/suricata/suricata.yaml

      - name: Validate Suricata rules
        run: |
          mkdir -p /tmp/suricata-logs
          suricata -T -c /etc/suricata/suricata.yaml \
            -l /tmp/suricata-logs

      - name: Run regression tests
        run: |
          sudo python3 scripts/test_rules.py
